name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Python の文法を確かめる
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: 取り込みからお知らせまで通しで確かめる（偽の AI）
        run: bash tests/smoke.sh
